services:
  postgresql:
    image: postgres:19.0-alpine
    container_name: shortlink-postgresql
    restart: unless-stopped
    environment:
      POSTGRES_DB: db_shortlink
      POSTGRES_USER: linkapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-YourStrongPassword}
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql
      - ../link-postgresql.sql:/docker-entrypoint-initdb.d/01-link.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "linkapp", "-d", "db_shortlink"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - shortlink-network

  # Redis 缓存服务
  redis:
    image: redis:8.12.0-alpine
    container_name: shortlink-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-YourStrongPassword} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-YourStrongPassword}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - shortlink-network

  # 短链接应用服务
  app:
    image: ghcr.io/haotangyuan/shortlink:latest
    container_name: shortlink-app
    restart: unless-stopped
    ports:
      - "8068:8068"
    environment:
      - TZ=Asia/Shanghai
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Shanghai
      - JAVA_OPTS=${JAVA_OPTS:--Xmx1024m -Xms512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-YourStrongPassword}
      - SPRING_THREADS_VIRTUAL_ENABLED=${SPRING_THREADS_VIRTUAL_ENABLED:-false}
      - SHORTLINK_DOMAIN=${SHORTLINK_DOMAIN:-localhost:8068}
    volumes:
      # 自定义配置文件挂载 - 需要确保这些文件存在
      - ./application-docker.yaml:/app/application.yaml:ro  # 应用配置
      - ./shardingsphere-config-docker.yaml:/app/shardingsphere-config.yaml:ro  # 分库分表配置
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8068/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - shortlink-network

# 数据卷
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# 网络
networks:
  shortlink-network:
    driver: bridge
